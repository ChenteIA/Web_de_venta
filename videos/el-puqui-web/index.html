<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #FAF4F1;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="3.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-carta"
        class="scene"
        data-composition-id="02-carta"
        data-composition-src="compositions/frames/02-carta.html"
        data-start="3"
        data-duration="9"
        data-track-index="1"
      ></div>

      <div
        id="el-03-como-pedir"
        class="scene"
        data-composition-id="03-como-pedir"
        data-composition-src="compositions/frames/03-como-pedir.html"
        data-start="12"
        data-duration="6"
        data-track-index="0"
      ></div>

      <div
        id="el-04-whatsapp"
        class="scene"
        data-composition-id="04-whatsapp"
        data-composition-src="compositions/frames/04-whatsapp.html"
        data-start="17.5"
        data-duration="8.6"
        data-track-index="1"
      ></div>

      <div
        id="el-05-cta"
        class="scene"
        data-composition-id="05-cta"
        data-composition-src="compositions/frames/05-cta.html"
        data-start="25.5"
        data-duration="4.5"
        data-track-index="0"
      ></div>

      <!-- SFX -->
      <audio
        id="el-sfx-0"
        src="assets/sfx/toque.mp3"
        data-start="18.9"
        data-duration="0.12"
        data-track-index="20"
        data-volume="0.45"
      ></audio>
      <audio
        id="el-sfx-1"
        src="assets/sfx/enviado.mp3"
        data-start="21.9"
        data-duration="0.2"
        data-track-index="21"
        data-volume="0.4"
      ></audio>
      <audio
        id="el-sfx-2"
        src="assets/sfx/recibido.mp3"
        data-start="23.5"
        data-duration="0.35"
        data-track-index="22"
        data-volume="0.4"
      ></audio>
      <audio
        id="el-sfx-3"
        src="assets/sfx/enviado.mp3"
        data-start="27.5"
        data-duration="0.2"
        data-track-index="23"
        data-volume="0.35"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { y: -1920, duration: 0.5, ease: "power3.inOut" }, 3);
        tl.fromTo("#el-02-carta", { y: 1920, opacity: 1 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 3);
        tl.to("#el-03-como-pedir", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 17.5);
        tl.fromTo("#el-04-whatsapp", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 17.5);
        tl.to("#el-04-whatsapp", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 25.5);
        tl.fromTo("#el-05-cta", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 25.5);
        tl.to({}, { duration: 30 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
