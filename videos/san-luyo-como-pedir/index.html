<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1350px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #FAF4F1; }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1080" data-height="1350">
      <div id="el-01-titulo" class="scene" data-composition-id="01-titulo" data-composition-src="compositions/frames/01-titulo.html" data-start="0" data-duration="2.6" data-track-index="0"></div>
      <div id="el-02-telefono" class="scene" data-composition-id="02-telefono" data-composition-src="compositions/frames/02-telefono.html" data-start="2.6" data-duration="11.0" data-track-index="1"></div>
      <div id="el-03-pago" class="scene" data-composition-id="03-pago" data-composition-src="compositions/frames/03-pago.html" data-start="13.6" data-duration="3.0" data-track-index="0"></div>
      <div id="el-04-entrega" class="scene" data-composition-id="04-entrega" data-composition-src="compositions/frames/04-entrega.html" data-start="16.6" data-duration="3.4" data-track-index="1"></div>
      <div id="el-05-progreso" class="scene" data-composition-id="05-progreso" data-composition-src="compositions/frames/05-progreso.html" data-start="0" data-duration="20" data-track-index="5"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      // Cortes: fundidos cortos; el teléfono sube desde abajo al entrar
      tl.to("#el-01-titulo", { opacity: 0, duration: 0.35, ease: "power2.inOut" }, 2.45);
      tl.to("#el-02-telefono", { opacity: 0, duration: 0.35, ease: "power2.inOut" }, 13.45);
      tl.fromTo("#el-03-pago", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.inOut" }, 13.6);
      tl.to("#el-03-pago", { opacity: 0, duration: 0.35, ease: "power2.inOut" }, 16.45);
      tl.fromTo("#el-04-entrega", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.inOut" }, 16.6);
      tl.to({}, { duration: 20 }, 0); // ancla: la línea de tiempo dura los 20 s completos
    </script>
  </body>
</html>
